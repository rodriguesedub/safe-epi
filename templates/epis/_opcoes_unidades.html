<option value="">Escolha a unidade</option>
{% for u in unidades %}<option value="{{ u.pk }}">{{ u.codigo }}, {{ u.tipo.nome }}, CA {{ u.tipo.numero_ca }}{% if u.tamanho %}, tam. {{ u.tamanho }}{% endif %}{% if u.validade %}, val. {{ u.validade|date:"d/m/Y" }}{% endif %}</option>
{% empty %}<option value="" disabled>Nenhuma unidade em estoque e válida para este tipo</option>{% endfor %}
